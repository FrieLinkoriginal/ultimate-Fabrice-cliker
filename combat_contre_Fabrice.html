<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>combat contre Fabrice</title>
<style>
:root{--page:#e4e4e4;--ink:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0d0d0d;--ink:#eee}}
:root[data-theme="dark"]{--page:#0d0d0d;--ink:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;padding:10px}
#game{width:100%;max-width:640px}
#stage{position:relative;aspect-ratio:640/400;background:#008080;transition:background .9s;overflow:hidden}
#stage.dark{background:#000}
#cv{width:100%;height:100%;display:block;cursor:default}
#win{position:absolute;left:50%;top:50%;width:min(320px,90%);transform:translate(-50%,-50%);background:#c0c0c0;border:2px outset #fff;font:13px Tahoma,Arial,sans-serif;color:#000}
#win .tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:3px 6px;font-weight:bold;display:flex;justify-content:space-between;transition:1.5s}
#win .mn{padding:2px 6px;transition:1.5s}
#win .sb{display:flex;gap:2px;padding:2px;transition:1.5s}
#win .sb i{flex:1;border:1px inset #888;padding:1px 4px;font-style:normal}
#win .bd{background:#fff;margin:3px;border:2px inset #888;transition:1s}
#wc{display:block;width:100%}
#win.br{background:transparent;border-color:transparent;transition:1s}
#win.br .tb{transform:translate(-160px,-260px) rotate(-40deg);opacity:0}
#win.br .mn{transform:translate(180px,-200px) rotate(30deg);opacity:0}
#win.br .sb{transform:translate(0,300px) rotate(12deg);opacity:0}
#win.br .bd{background:transparent;border-color:transparent}
#win.gone{display:none}
#panel{background:#000;color:#fff;border:4px solid #fff;margin-top:6px;padding:10px 14px;min-height:150px;visibility:hidden;box-sizing:border-box}
#hud{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
#bar{width:90px;height:14px;background:#a00}#bar i{display:block;height:100%;background:#ff0;width:100%}
#tx{font-size:18px;line-height:1.4;white-space:pre-wrap;min-height:50px;cursor:pointer}
#btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#btns button{font:inherit;font-size:16px;background:#000;color:#ff7f00;border:3px solid #ff7f00;padding:6px 12px;cursor:pointer}
#btns button.sel{background:#ff7f00;color:#000}
#btns button:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;opacity:.7;margin-top:6px;text-align:center}
#musicToggle{font:inherit;font-size:13px;margin-top:8px;padding:5px 10px;background:#c0c0c0;color:#111;border:2px solid;border-color:#fff #444 #444 #fff;cursor:pointer}
#musicToggle:focus-visible{outline:2px dotted currentColor;outline-offset:2px}

const $=s=>document.querySelector(s),cv=$("#cv"),c=cv.getContext("2d");
const battleMusic=$("#battleMusic"),musicToggle=$("#musicToggle");
battleMusic.volume=0.35;
musicToggle.addEventListener("click",()=>{
 battleMusic.muted=!battleMusic.muted;
 musicToggle.textContent=battleMusic.muted?"♫ Musique : coupée":"♫ Musique : activée";
 musicToggle.setAttribute("aria-pressed",battleMusic.muted?"true":"false");
 if(!battleMusic.muted)startBattleMusic();
});
function startBattleMusic(){
 if(!battleMusic.paused||battleMusic.muted)return;
 battleMusic.play().then(()=>{document.removeEventListener("pointerdown",startBattleMusic);document.removeEventListener("keydown",startBattleMusic)}).catch(error=>{
  if(error.name!=="NotAllowedError")console.error("Impossible de lire la musique du combat.",error);
 });
}
document.addEventListener("pointerdown",startBattleMusic);
document.addEventListener("keydown",startBattleMusic);
startBattleMusic();
const SoundContext=window.AudioContext||window.webkitAudioContext;
let soundContext=null;
function playAttackSound(attack){
 if(!SoundContext)return;
 if(!soundContext)soundContext=new SoundContext();
 if(soundContext.state==="suspended")soundContext.resume();
 const patterns={
  clic:[[880,.07],[660,.07],[990,.09]],
  chaise:[[180,.28],[115,.32]],
  tete:[[125,.18],[95,.28],[150,.13]],
  err:[[520,.06],[260,.08],[390,.1]],
  fin1:[[660,.1],[440,.16],[330,.22]],
  fin2:[[220,.24],[165,.3],[110,.35]]
 };
 const notes=patterns[attack]||[[330,.1],[220,.16]],start=soundContext.currentTime;
 notes.forEach(([frequency,duration],index)=>{
  const oscillator=soundContext.createOscillator(),gain=soundContext.createGain(),time=start+index*.13;
  oscillator.type=attack==="err"?"square":attack==="chaise"||attack==="fin2"?"sawtooth":"triangle";
  oscillator.frequency.setValueAtTime(frequency,time);
  oscillator.frequency.exponentialRampToValueAtTime(Math.max(40,frequency*.72),time+duration);
  gain.gain.setValueAtTime(.0001,time);
  gain.gain.exponentialRampToValueAtTime(.12,time+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
  oscillator.connect(gain);gain.connect(soundContext.destination);
  oscillator.start(time);oscillator.stop(time+duration+.01);
 });
}
const KILL=100,W=640,H=400,BX=220,BY=200,BW=200,BH=180,R=Math.random,wait=ms=>new Promise(r=>setTimeout(r,ms));
const S={hp:20,clicks:0,tookHit:false,dc:0,dbl:false,mult:1,bonus:0,mod:"normal",st:"intro",sx:0,sy:0,vy:0,li:1,inv:0,atk:null,fl:[],tm:0,shake:0,strikeT:0,broke:false,fabA:1,dying:false,dyT:0,er:[],flash:0,fall:0,fin:0,q:[],res:null};
function saveClickerProgress(earnedClicks,previousClicks,won){
  var key="fabrice-clicker-save",save;
  try{
    var raw=localStorage.getItem(key);
    save=raw?JSON.parse(raw):{};
    if(!save||typeof save!=="object"||Array.isArray(save))throw new Error("Sauvegarde du jeu invalide.");
    if(!save.u||typeof save.u!=="object"||Array.isArray(save.u))save.u={};
    if(!save.shop||typeof save.shop!=="object"||Array.isArray(save.shop))save.shop={};
    if(!save.shop.items||typeof save.shop.items!=="object"||Array.isArray(save.shop.items))save.shop.items={};
    var bank=Number(save.shop.bank);
    save.shop.bank=(Number.isFinite(bank)&&bank>0?bank:0)+earnedClicks;
    for(var threshold=80;threshold<=100;threshold+=10){
      if(previousClicks<threshold&&S.clicks>=threshold)save.u["s"+threshold]=1;
    }
    if(won){
      save.u.trueEnding=1;
      if(!S.tookHit)save.u.noHit=1;
    }
    localStorage.setItem(key,JSON.stringify(save));
  }catch(error){
    console.error("Impossible de sauvegarder les clics et succès du combat.",error);
  }
}

if(S.st==="strike"){const b=S.bar;b.hold-=dt;
if(b.hold>.7){c.strokeStyle="#f22";c.lineWidth=6;c.beginPath();c.moveTo(265,25);c.lineTo(375,175);c.moveTo(285,20);c.lineTo(395,165);c.stroke()}
if(b.hold<=0){S.st="menu";const r=S.res;S.res=null;r&&r()}
if(S.mult>1){c.fillStyle="#ff0";c.font="bold 20px monospace";c.textAlign="left";c.fillText("DOUBLE CLIC x"+S.mult,10,24)}}
if(S.er.length)drawEr(dt);if(S.flash>0){c.fillStyle="rgba(255,255,255,"+Math.min(1,S.flash)+")";c.fillRect(0,0,W,H);S.flash-=dt*.7}
S.fl=S.fl.filter(f=>(f.l-=dt)>0);S.fl.forEach(f=>{f.y-=40*dt;c.globalAlpha=Math.min(1,f.l*2);c.fillStyle="#ff0";c.font="bold 22px monospace";c.textAlign="center";c.fillText(f.t,f.x,f.y);c.globalAlpha=1})}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;S.tm+=dt;
if(S.st==="intro")intro(dt);
else{if(S.st==="fight")upd(dt);draw(dt)}
const p=Math.max(0,S.hp)/20*100;$("#bar i").style.width=p+"%";$("#hpn").textContent=Math.max(0,S.hp)+"/20";requestAnimationFrame(loop)}
/* ---------- Déroulé ---------- */
const fight=key=>{playAttackSound(key);S.st="fight";const a=Object.create(A[key]);a.t=0;a.init();S.atk=a;S.sx=BX+BW/2;S.sy=S.mod==="blue"?BY+BH-9:S.mod==="pink"?BY+BH*2/5:BY+BH/2;S.li=1;S.vy=0;S.inv=.8;return new Promise(r=>S.res=r)};
const strike=()=>{const previousClicks=S.clicks;S.st="strike";S.clicks=Math.min(S.clicks+S.mult,S.fin?KILL:KILL-4);const earnedClicks=S.clicks-previousClicks;if(earnedClicks>0)saveClickerProgress(earnedClicks,previousClicks,false);if(S.clicks>=KILL){S.flash=1.3;S.fall=1;S.dying=true}S.shake=.3;S.fl.push({t:"+"+S.mult,x:320,y:60,l:1.1});S.bar={hold:1.2};say("","none");return new Promise(r=>S.res=r)};
function unlockDoubleClickMilestones(previousClicks){
 const unlocked=[];
 if(previousClicks<20&&S.clicks>=20){S.dc++;unlocked.push("80 PV");}
 if(previousClicks<60&&S.clicks>=60){S.dc++;unlocked.push("40 PV");}
 if(unlocked.length)S.dbl=true;

}
function end(msg,win){if(win)saveClickerProgress(0,S.clicks,true);S.st="menu";$("#btns").innerHTML="";return say(msg,"none").then(()=>btns([["Retour","home"]])).then(()=>location.href="index.html")}
async function main(){

 let ch;for(;;){say(S.fin?"* Fabrice vacille derrière les erreurs."+(KILL-S.clicks>1?"s":"")+".":PROMPT[turn%PROMPT.length],"none");ch=await btns(S.fin?[["ATTAQUER","atk"]]:[["ATTAQUER","atk"],["ACT","act"],["FUIR","flee"]]);
  if(ch==="act"){ch=await btns([["Double clic ("+S.dc+"/2)","dbl",S.dc<=0],["Coucou!","hi"],["Retour","back"]],true);if(ch==="back")continue}break}
 if(ch==="flee"){await say("* Tu quittes le combat.\n* Fabrice te fait coucou.","none");return end("Tu as fui.\n* Fabrice continue de faire coucou, tout seul.")}
 if(ch==="atk"){const previousClicks=S.clicks;await strike();const unlocked=unlockDoubleClickMilestones(previousClicks);if(unlocked.length)await say("* Fabrice a "+unlocked.join(" et ")+" de vie.\n* Tu débloques "+(unlocked.length>1?"deux doubles clics":"un double clic")+" !");
  if(S.clicks>=KILL){S.dying=true;await say("* Fabrice ne tient plus.\n* Il fait coucou une dernière fois… puis disparaît.",2500);return end("Victoire.\n* La fenêtre « fabrice » est enfin fermée.",true)}
  const k=S.clicks;if(!S.fin&&S.clicks>=KILL-4){await finale();if(S.hp<=0){await say("* Tu es tombé.\n* Fabrice fait coucou.","none");return end("GAME OVER")}turn++;continue}if(S.fin){turn++;continue}}
 if(ch==="dbl"){S.dc--;S.mult*=2;S.bonus++;await say("* DOUBLE CLIC ! Tous tes clics sont multipliés (x"+S.mult+") pour toute la partie.\n* Mais Fabrice s’énerve : ses attaques contiennent un projectile de plus.")}
 if(ch==="hi"){
  const healed=Math.min(2,20-S.hp);
  S.hp+=healed;
  await say(healed?"* Tu dis bonjour à Fabrice.\n* Pour te remercier de ta politesse, il te rend "+healed+" PV.":"* Tu dis bonjour à Fabrice.\n* Il te remercie, mais tu as déjà tous tes PV.");
 }
 if(!S.q.length){S.mod=pickMod();S.q=shuf(ATK[S.mod]);ann="";{const sk={normal:0,pink:1,blue:2}[S.mod];if(sk!==S.skin)await swapSkin(sk)}}
 const key=S.q.shift();await say("","none");ann="";
 await fight(key);
 if(S.hp<=0){await say("* Tu es tombé.\n* Fabrice fait coucou.","none");return end("GAME OVER")}
 turn++}}
requestAnimationFrame(loop);main();
