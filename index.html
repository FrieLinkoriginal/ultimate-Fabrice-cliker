<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fabrice Clicker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--desk:#008080;--face:#c0c0c0;--navy:#000080;--ink:#000;--white:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--desk:#004a4a}}
:root[data-theme="dark"]{--desk:#004a4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--desk);font-family:"DotGothic16",ui-monospace,monospace;color:var(--ink);
 display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 10px 24px}
.score{background:var(--face);padding:6px 16px;font-size:20px;
 border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000}
.score b{display:inline-block;min-width:1.4em;text-align:right}
.stage{container-type:inline-size;position:relative;width:min(100%,460px);aspect-ratio:990/1616;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.fab{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:pointer;-webkit-tap-highlight-color:transparent;transform-origin:50% 90%}
.fab.hit{animation:wiggle .28s steps(6)}
.fab.hit2{animation:wiggle2 .28s steps(6)}
@keyframes wiggle{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2.2%,-1%) rotate(-2deg)}50%{transform:translate(2%,.6%) rotate(1.8deg)}75%{transform:translate(-1%,-.6%) rotate(-1deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes wiggle2{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(2.2%,-1%) rotate(2deg)}50%{transform:translate(-2%,.6%) rotate(-1.8deg)}75%{transform:translate(1%,-.6%) rotate(1deg)}100%{transform:translate(0,0) rotate(0)}}
.stage.dead .fab{cursor:not-allowed;filter:saturate(.75)}
.dlg{display:none;position:absolute;left:26.9%;top:53.4%;width:46.1%;background:var(--face);
 border:.5cqw solid;border-color:#fff #000 #000 #fff;box-shadow:.4cqw .4cqw 0 rgba(0,0,0,.45);padding:.5cqw}
.stage.dead .dlg{display:block}
.dlg.shake{animation:wiggle .25s steps(5)}
.tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-size:3.5cqw;padding:.6cqw 1cqw;display:flex;justify-content:space-between;align-items:center;line-height:1.2}
.tb .x{font:inherit;font-size:3cqw;line-height:1;padding:0;background:var(--face);color:#000;width:3.6cqw;height:3.4cqw;display:grid;place-items:center;cursor:pointer;
 border:.3cqw solid;border-color:#fff #000 #000 #fff}
.tb .x:active{border-color:#000 #fff #fff #000}
.tb .x:focus-visible{outline:.3cqw dotted #000;outline-offset:-.9cqw}
.bd{display:flex;align-items:center;gap:4cqw;padding:5cqw 4cqw 3cqw}
.ico{flex:none;width:8.6cqw;height:8.6cqw;border-radius:50%;background:#e00;border:.4cqw solid #800;position:relative}
.ico:before,.ico:after{content:"";position:absolute;left:50%;top:50%;width:5.6cqw;height:1.1cqw;background:#fff;transform:translate(-50%,-50%) rotate(45deg)}
.ico:after{transform:translate(-50%,-50%) rotate(-45deg)}
.msg{font-size:3.8cqw;line-height:1.5}
.ok{display:block;margin:1cqw auto 3cqw;width:40%;font:inherit;font-size:3.8cqw;padding:.8cqw 0;background:var(--face);color:#000;cursor:pointer;
 border:.4cqw solid;border-color:#fff #000 #000 #fff}
.ok:active{border-color:#000 #fff #fff #000}
.ok:focus-visible{outline:.4cqw dotted #000;outline-offset:-1.2cqw}
.hint{color:#fff;font-size:15px;text-align:center;min-height:1.4em}
.fab.fall{animation:fall .9s cubic-bezier(.55,0,1,.65) forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(140vh) rotate(16deg)}}
body.gone{overflow:hidden}
body{transition:background-color .6s}
[hidden]{display:none!important}
.top{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:stretch}
.click-bank{background:var(--face);padding:6px 12px;font-size:18px;min-width:110px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000}
.click-bank b{display:inline-block;min-width:1.3em;text-align:right}
.bank-icon{width:22px;height:22px;object-fit:contain;image-rendering:pixelated;display:block}
.shop-button{position:fixed;left:12px;bottom:56px;display:grid;place-items:center;width:64px;height:64px;padding:8px;background:var(--face);border:3px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px 0 rgba(0,0,0,.45);z-index:30;cursor:pointer}
.shop-button[hidden]{display:none!important}
.shop-button img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.shop-panel .panel{width:min(100%,560px)}
.shop-top{display:flex;justify-content:center;padding:8px 8px 0}
.shop-top img{display:block;width:88px;height:88px;object-fit:contain;image-rendering:pixelated;background:#fff;border:2px solid;border-color:#404040 #fff #fff #404040;padding:4px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:10px;background:#fff;border:2px solid;border-color:#404040 #fff #fff #404040;margin:6px;max-height:54vh;overflow:auto}
.shop-card{display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff}
.shop-card img{width:100%;height:92px;object-fit:contain;image-rendering:pixelated;background:#fdfdfd;border:2px solid;border-color:#404040 #fff #fff #404040}
.shop-card h3{margin:0;font-size:16px}
.shop-card p{margin:0;font-size:12px;line-height:1.35;min-height:52px}
.shop-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:14px}
.shop-buy{font:inherit;font-size:14px;background:var(--face);border:2px solid;border-color:#fff #000 #000 #fff;padding:6px 8px;cursor:pointer}
.shop-buy:disabled{cursor:not-allowed;opacity:.6}
.chat-box{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:20;background:var(--face);padding:6px;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:2px 2px 0 rgba(0,0,0,.45)}
.chat-box[hidden]{display:none!important}
.chat-box label{font-size:12px;padding:0 2px}
.chat-row{display:flex;gap:6px}
.chat-row input{font:inherit;font-size:15px;padding:4px 6px;min-width:150px;border:2px solid;border-color:#404040 #fff #fff #404040;background:#fff;color:#000}
.chat-row button{font:inherit;font-size:14px;background:var(--face);padding:4px 8px;border:2px solid;border-color:#fff #000 #000 #fff;cursor:pointer}
.chat-row button:focus-visible,.shop-buy:focus-visible,.shop-button:focus-visible,.b95:focus-visible{outline:2px dotted #000;outline-offset:-4px}
.b95{font:inherit;font-size:16px;color:#000;background:var(--face);cursor:pointer;padding:6px 12px;
 border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000}
.b95:active{border-color:#404040 #fff #fff #404040}
.b95[aria-pressed="false"]{color:#808080;text-decoration:line-through}
.b95:focus-visible{outline:2px dotted #000;outline-offset:-5px}
.again{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;font-size:22px;padding:10px 26px}
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:100}
.toast{width:min(88vw,320px);background:var(--face);border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:3px 3px 0 rgba(0,0,0,.45);padding:2px;animation:pop .25s steps(4)}
.toast .tb2,.panel .tb2{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-size:14px;padding:3px 6px;display:flex;justify-content:space-between;align-items:center}
.toast .tx{padding:8px 10px;font-size:16px;line-height:1.35}
.toast .tx small{display:block;font-size:13px;color:#404040}
@keyframes pop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:60;padding:16px}
.panel{width:min(100%,380px);max-height:80vh;display:flex;flex-direction:column;background:var(--face);border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:3px 3px 0 rgba(0,0,0,.45);padding:2px}
.panel .tb2 button{font:inherit;font-size:13px;width:20px;height:18px;line-height:1;padding:0;background:var(--face);color:#000;cursor:pointer;border:2px solid;border-color:#fff #000 #000 #fff}
.list{overflow:auto;margin:6px;background:#fff;border:2px solid;border-color:#404040 #fff #fff #404040;padding:4px;list-style:none}
.list li{display:flex;gap:8px;padding:5px 4px;font-size:15px;line-height:1.3;border-bottom:1px dotted #808080}
.list li:last-child{border-bottom:0}
.list li b{flex:none;width:1.2em;text-align:center}
.list li small{display:block;font-size:13px;color:#404040}
.list li.lock{color:#808080}
.list li.lock small{color:#808080}

.hsveil{z-index:70}
.panel.big{width:min(100%,660px);max-height:92vh}
.hsbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 210px;gap:10px;padding:8px;overflow:hidden}
.hsbody h3{margin:8px 0 4px;font-size:16px;font-weight:normal}
.mid{min-width:0;overflow:auto;text-align:center}
.mid .yours{margin:4px 0;font-size:18px}
.entry{display:flex;gap:6px;justify-content:center;margin:6px 0}
.entry input{font:inherit;font-size:16px;width:18em;max-width:100%;padding:4px 6px;color:#000;background:#fff;border:2px solid;border-color:#404040 #fff #fff #404040}
.entry input:disabled{background:#dcdcdc}
.hsmsg{min-height:1.3em;margin:2px 0 4px;font-size:14px}
.mid .list,.side .list{margin:0;text-align:left}
.side{display:flex;flex-direction:column;min-height:0;min-width:0}
.side .list{overflow:auto;max-height:min(360px,50vh)}
.list.rank li{align-items:baseline;padding:4px}
.list.rank .rk{flex:none;width:2.2em;text-align:right;color:#404040}
.list.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list.rank .sc{flex:none}
.list.rank li.bot{font-weight:bold;color:#000080}
.list.rank li.me{background:#000080;color:#fff}
.list.rank li.me .rk{color:#fff}
.foot{padding:4px 8px 8px;text-align:center}
.foot .b95{font-size:18px;padding:8px 26px}
@media (max-width:560px){.hsbody{grid-template-columns:1fr;overflow:auto}.side .list{max-height:220px}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}body{transition:none}}
@media (prefers-reduced-motion:reduce){.fab.hit,.fab.hit2,.dlg.shake,.word.shake{animation:none}}
.word{display:inline-block;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.word.shake{animation:tshake .45s linear}
@keyframes tshake{0%{transform:translate(0,0) rotate(0)}12%{transform:translate(-5px,-2px) rotate(-7deg)}25%{transform:translate(5px,2px) rotate(6deg)}37%{transform:translate(-4px,1px) rotate(-5deg)}50%{transform:translate(4px,-2px) rotate(4deg)}62%{transform:translate(-3px,1px) rotate(-3deg)}75%{transform:translate(3px,0) rotate(2deg)}87%{transform:translate(-1px,0) rotate(-1deg)}100%{transform:translate(0,0) rotate(0)}}
.stage{--xl:94.8%;--xt:.4%;--xw:4.6%;--xh:2.8%}
.xhit{position:absolute;z-index:2;left:var(--xl);top:var(--xt);width:var(--xw);height:var(--xh);padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.xhit:focus-visible{outline:2px dotted #fff;outline-offset:1px}
.handhit{position:absolute;z-index:2;left:6%;top:11%;width:28%;height:23%;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.handhit:focus-visible{outline:2px dotted #fff;outline-offset:1px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.secret{margin-top:90vh;padding:24px 0 8px;display:flex;justify-content:center}
.dl{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--face);color:#000;text-decoration:none;font-size:14px;padding:8px 10px;
 border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000}
.dl:active{border-color:#404040 #fff #fff #404040}
.dl:focus-visible{outline:2px dotted #000;outline-offset:-5px}
.dl img{display:block;width:72px;aspect-ratio:990/1616;height:auto;image-rendering:pixelated}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px;padding:8px;overflow:auto;background:#fff;
 border:2px solid;border-color:#404040 #fff #fff #404040}
.skin{font:inherit;font-size:13px;color:#000;background:var(--face);cursor:pointer;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;
 border:2px solid;border-color:#fff #404040 #404040 #fff}
.skin img{width:100%;aspect-ratio:990/1616;height:auto;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.skin.sel{border-color:#404040 #fff #fff #404040;background:#dcdcdc}
.skin:focus-visible{outline:2px dotted #000;outline-offset:-5px}
</style>
</head>
<body>
<div class="top"><div class="score" aria-live="polite">Clics : <b id="n">0</b></div><div class="click-bank" aria-live="polite"><img class="bank-icon" src="files/bank.png" alt="" aria-hidden="true"><span>Click bank : </span><b id="bank">0</b></div><button class="b95" id="trophy" type="button">Succès <span id="cnt">0/0</span></button><button class="b95" id="coll" type="button" hidden>Collection</button><button class="b95" id="mus" type="button" aria-pressed="true">♪ Musique</button></div>
<audio id="bgm" src="assets/musique.mp3" loop preload="auto"></audio>

    sizeCv();
    for(var i=0;i<36;i++){
      var a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1,v=4+Math.random()*7;
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*5,h:3+Math.random()*4,
        r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:COLORS[i%COLORS.length],life:0,max:60+Math.random()*40});
    }
    if(!raf)raf=requestAnimationFrame(tick);
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.life<p.max;});
    parts.forEach(function(p){
      p.life++;p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.globalAlpha=Math.min(1,(p.max-p.life)/20);
      cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    if(parts.length)raf=requestAnimationFrame(tick);
    else{raf=0;cx.clearRect(0,0,cv.width,cv.height);}
  }
  window.addEventListener("resize",function(){if(parts.length)sizeCv();});
  /* Clic sur la main de Fabrice : confettis + succès « Tope là » (compte aussi comme un clic) */
  var handhit=document.getElementById("handhit");
  handhit.addEventListener("click",function(e){
    if(fallen||dead)return;
    var r=handhit.getBoundingClientRect();
    var x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;
    confetti(x,y);
    unlock("hand");
    unlockShop();
    hit(1,wiggle);
  });
  /* Image à télécharger tout en bas de la page */
  var dl=document.getElementById("dl"),dlimg=document.getElementById("dlimg");
  dlimg.src=DEFAULT_SRC;
  try{
    var m=/^data:([^;]+);base64,/.exec(DEFAULT_SRC),bin=atob(DEFAULT_SRC.slice(m[0].length)),u8=new Uint8Array(bin.length);
    for(var j=0;j<bin.length;j++)u8[j]=bin.charCodeAt(j);
    dl.href=URL.createObjectURL(new Blob([u8],{type:m[1]}));
  }catch(e){dl.href=DEFAULT_SRC;}
  dl.addEventListener("click",function(){unlock("coll");unlockSkin("k3");});
})();
</script>
</body>
